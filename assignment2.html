<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Fixed-Width Page</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
    } @font-face {
        font-family: Georgia;
        src: url(../../Downloads/Tutorial%202%20Video/Georgia.ttf);
    } body {
        background: whitesmoke;
    } #page {
        width: 1024px;
        height: 1325px;
        background: white;
        border: 1px solid darkgray;
        box-shadow: 2px 3px 6px darkgray;
        margin: 24px auto;
    } #banner {
        width: 1024px;
		height: 250px;
    } h1 {
        font: 48pt/1.4em 'Dancing Script';
        text-align: center;
        margin: 54px 0 0 0;
        color: brown;
        text-shadow: 2px 3px 6px darkgray;
    } p {
        font: 14pt/1.4em Georgia;
        width: 768px;
        margin: 24px auto;
    } .float-left {
        width: 300px;
        float: left;
        margin: 0 24px 0 0;
        border: 1px solid darkgray;
        box-shadow: 2px 3px 6px darkgray;
    } ul {
        width: 100%;
        margin-top: -4px;
    } li {
        font: 14pt/2.0em Georgia;
        list-style: none;
        float: left;
        width: 50%;
        height: 40px;
        text-align: center;
        background: gray;
    } a li {
        color: black;
    } a {
        text-decoration: none;
    } li:hover, a li:hover {
        background: rgba(169,225,245,0.50);
    } #arrow {
        width: 75px;
        height: 75px;
        margin: 76px 0 0 24px;
        display: block;
	} video {
		width: 640px;
		heght: 360px;
		display: block;
		margin: 100px auto;
	}
</style>
</head>

<body>
    <div id="page">
        <img id="banner" src="newzealand.jpg" />
        <ul>
            <li>Home</li>
            <li>Portfolio</li>
        </ul>
		<video controls poster="humanmadeart.jpg">
			<source src="earthart.mp4" />
		</video>
</div>
</body>
</html>
